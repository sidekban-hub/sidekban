<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Buat Kata Sandi Baru - SidekBan</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 5C24 5 10 20.5 10 30a14 14 0 0 0 28 0C38 20.5 24 5 24 5Z' fill='%232563eb'/%3E%3Cpath d='M13 31c3-2.5 6-2.5 9 0s6 2.5 9 0' stroke='white' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-auth.js" defer></script>
</head>

<body class="auth-body auth-reset">

    <main class="auth-layout auth-layout-single">

        <!-- HEADER SIDekBAN -->
        <section class="auth-brand">

            <div class="auth-logo">
                <svg viewBox="0 0 40 48"
                     xmlns="http://www.w3.org/2000/svg"
                     role="img"
                     aria-label="Logo tetesan air">

                    <defs>
                        <linearGradient id="waterGradient"
                            x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#60a5fa"/>
                            <stop offset="100%" stop-color="#2563eb"/>
                        </linearGradient>
                    </defs>

                    <path
                        d="M20 2 C16 9 5 20 5 29
                           A15 15 0 0 0 35 29
                           C35 20 24 9 20 2Z"
                        fill="url(#waterGradient)"/>

                    <path
                        d="M10 28 Q15 23 20 28 T30 28"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="2"
                        stroke-linecap="round"/>

                    <path
                        d="M12 33 Q17 28 22 33 T29 33"
                        fill="none"
                        stroke="#ffffff"
                        stroke-width="1.5"
                        stroke-linecap="round"/>
                </svg>
            </div>

            <div class="brand-name">SidekBan</div>

            <p class="brand-caption">
                Smart Flood Detection System
            </p>

        </section>

        <!-- FORM RESET PASSWORD -->
        <section class="auth-card">

            <p class="eyebrow">PEMULIHAN AKUN</p>

            <h1>Buat kata sandi baru</h1>

            <p class="auth-subtitle">
                Masukkan kata sandi baru untuk akunmu.
            </p>

            <form id="reset-form">

                <label for="password">
                    Kata sandi baru
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Masukkan kata sandi baru"
                    required
                >

                <label for="password-confirm">
                    Ulangi kata sandi baru
                </label>

                <input
                    id="password-confirm"
                    name="password-confirm"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Ulangi kata sandi baru"
                    required
                >

                <button id="reset-button" type="submit">
                    Simpan kata sandi
                </button>

                <p
                    id="auth-message"
                    class="message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

            <a class="back-link" href="login.html" id="cancel-reset">
                ← Kembali ke login
            </a>

        </section>

    </main>

</body>
</html>
